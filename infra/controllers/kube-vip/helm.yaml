# https://github.com/kube-vip/helm-charts/releases
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-vip
spec:
  interval: 20m
  chart:
    spec:
      interval: 2h
      sourceRef:
        kind: HelmRepository
        name: kube-vip
      chart: kube-vip
      version: "0.11.1"
  valuesFrom:
  - kind: ConfigMap
    name: kube-vip-values

