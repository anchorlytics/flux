# https://github.com/kube-vip/helm-charts/blob/main/charts/kube-vip/values.yaml
# https://github.com/kube-vip/kube-vip/releases
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-vip-values
data:
  values.yaml: |
    image:
      tag: v1.3.0
    config:
      address: 10.80.5.5
    env:
      vip_arp: "true"
      vip_interface: k8s
      vip_leaderelection: "true"
      enable_node_labeling: "true"
      bgp_enable: "false"
      svc_enable: "false"
      svc_election: "false"
      lb_enable: "false"
      cp_enable: "true"
    envFrom:
    - secretRef:
        name: kube-vip-config
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists

