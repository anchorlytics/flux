# https://quay.io/repository/ceph/ceph?tab=tags
# https://github.com/rook/rook/blob/master/deploy/charts/rook-ceph-cluster/values.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ceph-cluster-values
data:
  values.yaml: |
    cephImage:
      tag: v21.1.1
    toolbox:
      enabled: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: "feature.node.kubernetes.io/cpu-cpuid.X86_64_V3"
                operator: Exists
    dashboard:
      enabled: true
      ssl: false
    monitoring:
      enabled: true
    crashCollector:
      disable: true
    dataDirHostPath: /var/lib/rook
    placement:
      all:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: role
                  operator: In
                  values:
                  - ceph
                - key: "feature.node.kubernetes.io/cpu-cpuid.X86_64_V3"
                  operator: Exists
      osd:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: ceph-role
                  operator: In
                  values:
                  - osd
    resources:
      osd:
        requests:
          cpu: "500m"
        limits:
          cpu: "1500m"
    storage:
      useAllNodes: true
      useAllDevices: true
      config:
        encryptedDevice: "true"
    security:
      cephx:
        csi:
          keyType: aes
