# https://ceph.github.io/ceph-csi-operator/helm-charts/drivers-chart/
# Template: https://github.com/rook/rook/blob/master/deploy/charts/ceph-csi-drivers/values.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: csi-driver-values
data:
  values.yaml: |
    operatorConfig:
      namespace: rook-ceph
      driverSpecDefaults:
        imageSet:
          name: rook-csi-operator-image-set-configmap
        nodePlugin:
          priorityClassName: system-node-critical
          labels:
            app: ceph-csi
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: role
                    operator: In
                    values:
                    - ceph
        controllerPlugin:
          priorityClassName: system-cluster-critical
          replicas: 2
          labels:
            app: ceph-csi
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: role
                    operator: In
                    values:
                    - ceph
    drivers:
      rbd:
        enabled: true
        name: rook-ceph.rbd.csi.ceph.com
        snapshotPolicy: volumeSnapshot
      cephfs:
        enabled: true
        name: rook-ceph.cephfs.csi.ceph.com
        snapshotPolicy: volumeSnapshot
      nfs:
        enabled: true
        name: rook-ceph.nfs.csi.ceph.com
      nvmeof:
        enabled: false
        name: rook-ceph.nvmeof.csi.ceph.com
    cephConnections:
    - name: ceph-connection
      monitors:
        cl: "10.43.245.51:6789"
        cn: "10.43.178.87:6789"
        cp: "10.43.193.249:6789"
    clientProfiles:
    - name: rook-ceph
      cephConnection:
        name: ceph-connection
      cephFs:
        subVolumeGroup: csi
        cephCsiSecrets:
          controllerPublishSecret:
            name: rook-csi-cephfs-provisioner
            namespace: rook-ceph
          nodePublishSecret:
            name: rook-csi-cephfs-node
            namespace: rook-ceph
      rbd:
        cephCsiSecrets:
          controllerPublishSecret:
            name: rook-csi-rbd-provisioner
            namespace: rook-ceph
          nodePublishSecret:
            name: rook-csi-rbd-node
            namespace: rook-ceph
