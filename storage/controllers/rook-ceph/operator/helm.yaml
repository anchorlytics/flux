# https://github.com/rook/rook/releases
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-operator
spec:
  interval: 10m
  chart:
    spec:
      interval: 2h
      sourceRef:
        kind: HelmRepository
        name: rook
      chart: rook-ceph
      version: "v1.21.0"
  valuesFrom:
  - kind: ConfigMap
    name: ceph-operator-values
